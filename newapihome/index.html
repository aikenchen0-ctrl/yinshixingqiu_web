<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="多元探索，一站式 AI 工作台。模型即服务，API 聚合，创作不绕路。"
    />
    <title>多元探索</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="landing-shell">
      <canvas class="particle-stage" id="particle-stage" aria-hidden="true"></canvas>
      <div class="pointer-aura" id="pointer-aura" aria-hidden="true"></div>
      <div class="background-noise" aria-hidden="true"></div>
      <div class="background-glow" aria-hidden="true"></div>
      <div class="floating-copy" id="floating-copy" aria-hidden="true"></div>
      <section class="hero-mark" aria-label="多元探索品牌主页">
        <div class="hero-beam hero-beam-left" aria-hidden="true"></div>
        <div class="hero-beam hero-beam-right" aria-hidden="true"></div>
        <div class="brand-core">
          <div class="hero-lens" aria-hidden="true"></div>
          <div class="brand-core-shell" aria-hidden="true"></div>
          <div class="brand-core-energy" aria-hidden="true"></div>
          <div class="core-orbit core-orbit-outer" aria-hidden="true"></div>
          <div class="core-orbit core-orbit-inner" aria-hidden="true"></div>
          <div class="brand-core-glow" aria-hidden="true"></div>
          <img class="brand-mark" src="./logo.svg" alt="多元探索" />
        </div>
        <div class="model-spokes" id="model-spokes" aria-hidden="true"></div>
        <div class="model-ring" id="model-ring" aria-label="AI 模型御三家"></div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
